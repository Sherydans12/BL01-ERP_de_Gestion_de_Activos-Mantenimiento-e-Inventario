<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <!--
      El frontend Docker escucha en 8080 solo *dentro* del contenedor. Si esa URL llega al
      navegador (proxy/Coolify mal configurado), Cloudflare intenta :8080 y devuelve 522.
      Normalizamos de inmediato al mismo host/protocolo sin puerto explícito.
    -->
    <script>
      (function () {
        if (typeof location === 'undefined') return;
        if (location.port !== '8080') return;
        var host = location.hostname;
        if (host === 'localhost' || host === '127.0.0.1' || host === '[::1]') return;
        var target =
          location.protocol +
          '//' +
          host +
          location.pathname +
          location.search +
          location.hash;
        location.replace(target);
      })();
    </script>
    <title>BaseLogic — EAM / ERP industrial</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="EAM / ERP multicontrato: flota, órdenes de trabajo, inventario y trazabilidad — BaseLogic para minería e industria pesada."
    />
    <!-- Favicon / instalación: logo BaseLogic -->
    <link rel="icon" type="image/png" href="assets/BaseLogic_Logo.png" />
    <link rel="apple-touch-icon" href="assets/BaseLogic_Logo.png" />
    <link rel="manifest" href="assets/manifest.webmanifest" />
    <meta name="theme-color" content="#09090b" />
    <meta name="color-scheme" content="dark" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
