@if (open) {
<div
  class="inset-0 z-[80] flex items-center justify-center bg-black/60 backdrop-blur-sm"
  [class.fixed]="!overlayInsideDialog"
  [class.absolute]="overlayInsideDialog"
  (click)="close()"
>
  <div class="bg-surface border border-border rounded-xl shadow-2xl w-full max-w-md mx-4 p-6" (click)="$event.stopPropagation()">
    <div class="flex items-center justify-between mb-5">
      <h3 class="text-lg font-bold text-main">Crear artículo — Catálogo Maestro de Artículos</h3>
      <button (click)="close()" class="text-muted hover:text-main transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>

    <div class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-muted mb-1">Nombre del artículo *</label>
        <input type="text" [(ngModel)]="name" placeholder="Ej: Filtro de aceite motor"
               class="w-full px-3 py-2 bg-dark border border-border rounded-lg text-main text-sm focus:border-primary focus:outline-none">
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div>
          <label class="block text-[10px] font-mono text-muted uppercase tracking-widest mb-1">Familia *</label>
          <select [(ngModel)]="familyId" (ngModelChange)="onFamilyChange($event)"
                  class="w-full px-3 py-2 bg-dark border border-border rounded-lg text-main text-sm focus:border-primary focus:outline-none">
            <option value="">— Seleccionar —</option>
            @for (f of families(); track f.id) {
              <option [value]="f.id">{{ f.name }}</option>
            }
          </select>
        </div>
        <div>
          <label class="block text-[10px] font-mono text-muted uppercase tracking-widest mb-1">Subcategoría *</label>
          <select [(ngModel)]="subcategoryId"
                  [disabled]="!familyId"
                  class="w-full px-3 py-2 bg-dark border border-border rounded-lg text-main text-sm focus:border-primary focus:outline-none disabled:opacity-50">
            <option value="">{{ familyId ? '— Elegir subcategoría —' : '— Primero familia —' }}</option>
            @for (c of subcategories(); track c.id) {
              <option [value]="c.id">{{ c.name }}</option>
            }
          </select>
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <div>
          <label class="block text-sm font-medium text-muted mb-1">Unidad de medida *</label>
          <select [(ngModel)]="unitOfMeasureId"
                  class="w-full px-3 py-2 bg-dark border border-border rounded-lg text-main text-sm focus:border-primary focus:outline-none">
            @for (u of units(); track u.id) {
              <option [value]="u.id">{{ u.name }} ({{ u.abbreviation }})</option>
            }
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-muted mb-1">Stock crítico <span class="text-xs font-normal">(opc.)</span></label>
          <input type="number" [(ngModel)]="minStock" placeholder="—" min="0"
                 class="w-full px-3 py-2 bg-dark border border-border rounded-lg text-main text-sm focus:border-primary focus:outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium text-muted mb-1">Stock máximo <span class="text-xs font-normal">(opc.)</span></label>
          <input type="number" [(ngModel)]="maxStock" placeholder="—" min="0"
                 class="w-full px-3 py-2 bg-dark border border-border rounded-lg text-main text-sm focus:border-primary focus:outline-none">
        </div>
      </div>
    </div>

    <p class="text-xs text-muted mt-4">Se generará un Nº de parte automático. Podrá editarlo después desde el catálogo.</p>

    <div class="flex justify-end gap-3 mt-5 pt-4 border-t border-border">
      <button (click)="close()" class="px-4 py-2 border border-border rounded-lg text-muted hover:text-main text-sm transition-colors">Cancelar</button>
      <button (click)="save()" [disabled]="isSaving() || !name.trim() || !subcategoryId"
              class="px-4 py-2 bg-primary text-black font-medium rounded-lg text-sm hover:bg-primary/90 transition-colors disabled:opacity-50">
        {{ isSaving() ? 'Creando...' : 'Crear y vincular' }}
      </button>
    </div>
  </div>
</div>
}
