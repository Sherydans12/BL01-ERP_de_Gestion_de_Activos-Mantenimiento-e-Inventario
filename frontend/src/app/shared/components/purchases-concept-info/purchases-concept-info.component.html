<span class="inline-flex items-center gap-1 relative align-middle">
  <button
    type="button"
    class="inline-flex items-center justify-center w-5 h-5 rounded-full border border-border text-muted hover:text-primary hover:border-primary/50 focus:outline-none focus:ring-2 focus:ring-primary/30"
    (click)="toggle(); $event.stopPropagation()"
    [attr.aria-expanded]="open()"
    [attr.aria-label]="'Información: ' + label()"
    [attr.title]="text()"
  >
    <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true">
      <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd" />
    </svg>
  </button>
  @if (open()) {
    <div
      class="absolute z-30 left-0 top-full mt-1 w-[min(20rem,calc(100vw-2rem))] p-3 rounded-lg border border-border bg-surface shadow-lg text-xs text-main leading-snug"
      role="tooltip"
      (click)="$event.stopPropagation()"
    >
      <p class="font-semibold text-main mb-1">{{ label() }}</p>
      <p class="text-muted">{{ text() }}</p>
    </div>
  }
</span>
