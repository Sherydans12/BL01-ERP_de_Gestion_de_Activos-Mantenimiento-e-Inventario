version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: erp-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata-prod-v2:/var/lib/postgresql/data
    networks:
      - erp-network-prod

  db-backup:
    image: eeshugerman/postgres-backup-s3:16
    container_name: erp-db-backup
    restart: always
    depends_on:
      - db
    networks:
      - erp-network-prod
    environment:
      POSTGRES_HOST: db
      POSTGRES_DATABASE: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET: baselogic-storage-prod
      S3_PREFIX: backups-diarios
      SCHEDULE: '0 3 * * *'
      BACKUP_KEEP_DAYS: 7 # <-- Limpia automáticamente R2 manteniendo solo los últimos 7 días

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: erp-backend-prod
    restart: always
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?schema=public
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
    depends_on:
      - db
    expose:
      - "3000"
    networks:
      - erp-network-prod
      - coolify
    labels:
      - "traefik.docker.network=coolify"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: erp-frontend-prod
    restart: always
    depends_on:
      - backend
    expose:
      - "80"
    networks:
      - erp-network-prod
      - coolify
    labels:
      - "traefik.docker.network=coolify"

volumes:
  pgdata-prod-v2:

networks:
  erp-network-prod:
    driver: bridge
  coolify:
    external: true