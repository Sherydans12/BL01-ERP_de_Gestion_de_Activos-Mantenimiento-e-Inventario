# CI — lint, build y suites unitarias (sin PostgreSQL).
# Push/PR a main y develop.
#
# Paridad local antes de push (evita fallos prettier en Actions):
#   cd backend  && npm run lint && npm run lint:ci && npm run test:domain
#   cd frontend && npm run build && npm run test:ci
# `npm run lint` aplica --fix; `lint:ci` es el gate estricto (sin --fix).
name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Lint, build and domain tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # --- Backend ---
      - name: Cache backend dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            backend/node_modules
          key: ${{ runner.os }}-node22-backend-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node22-backend-

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Lint backend (eslint + prettier, max-warnings 0)
        working-directory: backend
        run: npm run lint:ci

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Run domain unit tests
        working-directory: backend
        run: npm run test:domain

      # --- Frontend ---
      - name: Cache frontend dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            frontend/node_modules
          key: ${{ runner.os }}-node22-frontend-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node22-frontend-

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Run frontend unit tests (ChromeHeadless)
        working-directory: frontend
        run: npm run test:ci
        env:
          CHROMIUM_FLAGS: "--no-sandbox --disable-gpu --disable-dev-shm-usage"
